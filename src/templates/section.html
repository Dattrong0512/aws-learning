<section class="section" id="sec-{{hash}}">
  <div class="sec-toolbar">
    <button class="back" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg><span>{{allSections}}</span></button>
    <div class="sec-actions"><button class="expand-btn" type="button">{{expand}}</button></div>
  </div>
  <h2><span class="sec-title" data-sec-title="{{key}}">{{name}}</span></h2>
  <div class="content" data-sec="{{hash}}" data-content-format="refactored-v2">
{{CONTENT}}
  </div>
</section>
